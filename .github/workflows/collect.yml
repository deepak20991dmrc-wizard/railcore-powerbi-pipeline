
name: RailCore Train Data Collection

on:
  schedule:
    - cron: "0 20-23,0-8 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect train data
        env:
          RAILCORE_API_KEY: ${{ secrets.RAILCORE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python collector.py

      - name: Export Supabase data to CSV
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export_csv.py

      - name: Commit updated CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update train observations CSV"
          file_pattern: data/train_observations.csv
