
name: Train Master Data Update

on:
  workflow_dispatch:

jobs:
  update-train-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch train master data
        env:
          RAILCORE_API_KEY: ${{ secrets.RAILCORE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python train_master.py
