
name: Test Multi Train Collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run multi-train collector
        env:
          RAILCORE_API_KEY: ${{ secrets.RAILCORE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collector_multi.py
